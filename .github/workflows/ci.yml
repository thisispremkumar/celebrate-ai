name: CelebrateAI CI Quality & Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality, Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Analysis & Linter
        run: npm run lint

      - name: Unit & Integration Test Suites
        run: npm test

      - name: Production TypeScript Compilation & Bundle
        run: npm run build
